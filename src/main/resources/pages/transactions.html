<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
</head>
<body>
<h1>Transactions</h1>
<p>Lodge balance: <strong>{{balance}}</strong></p>
<p><a href="/">Back to index</a></p>
<button type="button" onclick="openAddDialog()">Add transaction</button>
<dialog id="addDialog" aria-labelledby="addTitle">
    <h2 id="addTitle">Add a transaction</h2>
    <form id="addTransactionForm" method="post" action="/transactions/add">
    <p>
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
    </p>
    <p>
        <label for="description">Description</label>
        <input type="text" id="description" name="description" required>
    </p>
    <p>
        <label for="type">Type</label>
        <select id="type" name="type" required>
            <option value="">Choose a type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
    </p>
    <p>
        <label for="amount">Amount (whole numbers only)</label>
        <input type="number" id="amount" name="amount" min="1" step="1" required>
    </p>
        <button type="submit">Save transaction</button>
        <button type="button" onclick="document.getElementById('addDialog').close()">
            Cancel
        </button>
    </form>
</dialog>
<h2>Transaction history</h2>
<form id="transactionSearch" method="get" action="/transactions">
    <label for="search">Search by description</label>
    <input type="search" id="search" name="search" value="{{searchText}}">
    <button type="submit">Search</button>
    <a href="/transactions">Show all</a>
</form>
<form method="post" action="/transactions/undo">
    <button type="submit">Undo last deletion</button>
</form>
<table>
    <thead>
    <tr>
        <th scope="col">
            ID
            <button form="transactionSearch" name="sort" value="id-asc" aria-label="Sort by lowest ID first">↑</button>
            <button form="transactionSearch" name="sort" value="id-desc" aria-label="Sort by highest ID first">↓</button>
        </th>
        <th scope="col">
            Date
            <button form="transactionSearch" name="sort" value="date-asc" aria-label="Sort by oldest date first">↑</button>
            <button form="transactionSearch" name="sort" value="date-desc" aria-label="Sort by newest date first">↓</button>
        </th>
        <th scope="col">Description</th>
        <th scope="col">Type</th>
        <th scope="col">
            Amount
            <button form="transactionSearch" name="sort" value="amount-asc" aria-label="Sort by lowest amount first">↑</button>
            <button form="transactionSearch" name="sort" value="amount-desc" aria-label="Sort by highest amount first">↓</button>
        </th>
        <th scope="col">Last modified by (user ID)</th>
        <th scope="col">Actions</th>
    </tr>
    </thead>
    <tbody>
    {{transactionRows}}
    </tbody>
</table>
<dialog id="editDialog" aria-labelledby="editTitle">
    <h2 id="editTitle">Edit transaction</h2>
    <form method="post" action="/transactions/update">
        <input type="hidden" id="editID" name="id">
        <p>
            <label for="editDate">Date</label>
            <input type="date" id="editDate" name="date" required>
        </p>
        <p>
            <label for="editDescription">Description</label>
            <input type="text" id="editDescription" name="description" required>
        </p>
        <p>
            <label for="editType">Type</label>
            <select id="editType" name="type" required>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>
        </p>
        <p>
            <label for="editAmount">Amount (whole numbers only)</label>
            <input type="number" id="editAmount" name="amount" min="1" step="1" required>
        </p>
        <button type="submit">Save changes</button>
    </form>
    <form method="dialog">
        <button type="submit">Cancel</button>
    </form>
</dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle">
    <h2 id="deleteTitle">Delete transaction?</h2>
    <p id="deleteSummary"></p>
    <form method="post" action="/transactions/delete">
        <input type="hidden" id="deleteID" name="id">

        <button type="button" autofocus
                onclick="document.getElementById('deleteDialog').close()">
            Cancel
        </button>
        <button type="submit">Delete transaction</button>
    </form>
</dialog>
<!-- JAVASCRIPT FUNCTIONALITIES -->
<script>
    function openAddDialog() {
        document.getElementById("addTransactionForm").reset();
        document.getElementById("addDialog").showModal();
    }
    function openEdit(button) {
        const cells = button.closest("tr").cells;
        const transactionID = cells[0].textContent;

        document.getElementById("editTitle").textContent = "Edit transaction #" + transactionID;
        document.getElementById("editID").value = transactionID;
        document.getElementById("editDate").value = cells[1].textContent;
        document.getElementById("editDescription").value = cells[2].textContent;
        document.getElementById("editType").value = cells[3].textContent;
        document.getElementById("editAmount").value = cells[4].textContent;

        document.getElementById("editDialog").showModal();
    }
    function openDelete(button) {
        const cells = button.closest("tr").cells;
        const id = cells[0].textContent;
        const date = cells[1].textContent;
        const description = cells[2].textContent;
        const type = cells[3].textContent;
        const amount = cells[4].textContent;

        document.getElementById("deleteID").value = id;
        document.getElementById("deleteSummary").textContent =
            `#${id} · ${date} · ${description} · ${type} · ${amount}`;

        document.getElementById("deleteDialog").showModal();
    }
</script>
</body>
</html>
